name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android-build:
    name: Android lint + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  # The Room migration suite is instrumented, so `testDebugUnitTest` never touched it —
  # 25 migrations covering v1 to v26 ran against real user databases on every upgrade with
  # nothing verifying them in CI. Their failure mode is silent local data loss, which is
  # worth an emulator boot.
  #
  # Separate from android-build so a KVM-less or flaky emulator run is legible as itself
  # rather than looking like a compile failure.
  migration-tests:
    name: Room migration tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The emulator needs hardware acceleration; ubuntu-latest runners expose KVM only
      # after this rule is installed.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 26 is the app's minSdk — the oldest platform a migration has to survive.
          api-level: 26
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  firebase-rules:
    name: Deploy Firestore rules (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Firestore rules
        uses: w9jds/firebase-action@v15.26.0
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  admin-web:
    name: Admin portal placeholder check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure root portal has no admin script reference
        run: |
          if grep -q "js/app.js" admin-website/index.html; then
            echo "ERROR: root index.html must not load the admin CRUD script" && exit 1
          fi
          echo "root portal is neutralized"
