name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android-build:
    name: Android lint + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

  firebase-rules:
    name: Deploy Firestore rules (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Firestore rules
        uses: w9jds/firebase-action@v13
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  admin-web:
    name: Admin portal placeholder check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure root portal has no admin script reference
        run: |
          if grep -q "js/app.js" admin-website/index.html; then
            echo "ERROR: root index.html must not load the admin CRUD script" && exit 1
          fi
          echo "root portal is neutralized"
