name: Release

# Triggered by pushing a tag like v1.5.0 (must match app/build.gradle.kts's versionName).
# Builds the signed release APK, attaches it to the GitHub Release, refreshes the download
# site, and writes the app_releases doc — the four manual steps a release previously
# required by hand.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build, sign, and publish a release
    runs-on: ubuntu-latest
    # Creating the GitHub Release and uploading APK assets to it writes to the repository,
    # which the workflow's default read-only GITHUB_TOKEN cannot do.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the versionCode bump check reads the previous release
          # tag's build.gradle.kts, which a default shallow checkout cannot see.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"

          # versionCode must match what's actually baked into the APK by Gradle — read
          # it from the same build.gradle.kts the build itself uses, not an unrelated
          # CI counter, or the in-app update check would compare against the wrong number.
          #
          # Anchored to the start of the line and required to match exactly once. The
          # previous unanchored grep took whatever came first in the file, so a comment
          # or a second build flavour mentioning versionCode would silently have been
          # published as the release's build number.
          CODE_MATCHES=$(grep -cP '^\s*versionCode\s*=\s*[0-9]+' app/build.gradle.kts || true)
          if [ "$CODE_MATCHES" != "1" ]; then
            echo "Expected exactly one versionCode assignment in app/build.gradle.kts, found $CODE_MATCHES" >&2
            exit 1
          fi
          CODE=$(grep -oP '^\s*versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)

          GRADLE_NAME=$(grep -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "$GRADLE_NAME" != "$NAME" ]; then
            echo "Tag $TAG doesn't match app/build.gradle.kts's versionName ($GRADLE_NAME) — bump it before tagging." >&2
            exit 1
          fi

          # The one place this release's permanent download URL is spelled out. Every later
          # step and the app_releases doc read it from here, so the asset filename and the
          # published URL cannot drift apart.
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kasiguru-v${NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME (versionCode $CODE)"

      - name: Check versionCode was bumped
        run: |
          set -euo pipefail
          CODE="${{ steps.version.outputs.code }}"

          # Only versionName was checked before. Shipping a new versionName on a stale
          # versionCode produces an APK Android refuses to install over the existing one,
          # and an in-app update check — which compares versionCode, not name — that never
          # fires. Both failures surface after release, to users, not here.
          PREV_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname \
            | grep -v "^${GITHUB_REF_NAME}$" | head -n1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No earlier release tag to compare against; skipping bump check."
            exit 0
          fi

          PREV_CODE=$(git show "$PREV_TAG:app/build.gradle.kts" \
            | grep -oP '^\s*versionCode\s*=\s*\K[0-9]+' | head -n1 || true)
          if [ -z "$PREV_CODE" ]; then
            echo "Could not read versionCode from $PREV_TAG; skipping bump check."
            exit 0
          fi

          if [ "$CODE" -le "$PREV_CODE" ]; then
            echo "versionCode $CODE is not greater than $PREV_TAG's $PREV_CODE — bump it before tagging." >&2
            exit 1
          fi
          echo "versionCode $CODE > $PREV_TAG's $PREV_CODE"

      # A tag build previously ran no tests at all: lint and unit tests lived only in
      # ci.yml, which triggers on pushes to main and pull requests, never on tags. So a
      # tagged commit could ship without a single test having run against it.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      # app/build.gradle.kts resolves the release signingConfig with
      # signingConfigs.findByName("release"), which returns null — yielding an *unsigned*
      # APK rather than a build failure — if keystore.properties is missing or unusable.
      # Nothing downstream checked, so an unsigned artifact would have been published and
      # announced in app_releases. Users cannot install it.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "Release APK missing at $APK" >&2; exit 1; }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f \
            | sort -V | tail -n1)
          test -n "$APKSIGNER" || { echo "apksigner not found in $ANDROID_HOME/build-tools" >&2; exit 1; }

          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK signature verified"

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Stage the APK under its release asset names
        # Two names for one file, both attached to the GitHub Release:
        #   kasiguru-v<name>.apk — permanent and version-specific. This is what
        #     app_releases points at; GitHub keeps release assets for the life of the repo.
        #   kasiguru-latest.apk  — a *fixed* asset name, which is what makes
        #     /releases/latest/download/kasiguru-latest.apk resolve to whatever shipped
        #     last. That URL is the download page's static href, the one that has to work
        #     before Firestore answers.
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk \
            "release-assets/kasiguru-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk \
            "release-assets/kasiguru-latest.apk"

      # Installed *before* anything is published on purpose. This step and the app_releases
      # write are the two halves of a release that can disagree: once the APK is public, an
      # npm failure here would leave users able to download a build the in-app update check
      # still reports as "up to date". Doing the fallible, side-effect-free half first
      # shrinks that window to the Firestore write itself.
      - name: Install publish dependencies
        working-directory: functions
        run: npm install --omit=dev

      # APKs live on the GitHub Release, not on the download site. The site is redeployed
      # from a fresh checkout every release and *.apk is gitignored, so a deployment can
      # only ever carry the single APK CI just built — which is why every older versioned
      # URL on that host used to 404 the moment the next release shipped. GitHub keeps
      # release assets permanently, so a version's download URL stays valid forever.
      - name: Attach the APKs to the GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KasiGuru v${{ steps.version.outputs.name }}
          files: |
            release-assets/kasiguru-v${{ steps.version.outputs.name }}.apk
            release-assets/kasiguru-latest.apk
          fail_on_unmatched_files: true

      # Confirms the asset actually serves before Firestore is told it exists. Announcing a
      # release whose APK 404s is the one ordering mistake worse than mislabelling, because
      # the app would then prompt users toward a broken download.
      - name: Verify the published APK is reachable
        run: |
          set -euo pipefail
          URL="${{ steps.version.outputs.apk_url }}"
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "$URL is live (HTTP $CODE)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $CODE — waiting for the asset to propagate"
            sleep 15
          done
          echo "$URL never returned 200; refusing to announce this release." >&2
          exit 1

      # Deliberately non-blocking, and deliberately *after* the APK is published. The site
      # no longer carries the binary — it only reads app_releases — so a failed deploy dates
      # the marketing copy, it does not withhold the release. This step failing while
      # everything else succeeded is exactly what stranded v1.14.0 (a VERCEL_TOKEN belonging
      # to an account that no longer owns the project), and it must not strand one again.
      - name: Deploy download site to Vercel
        id: deploy
        continue-on-error: true
        working-directory: admin-website/download
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Not secret — just identifiers for which Vercel project this is, the same ones
          # `vercel link` already wrote locally to the (gitignored) .vercel/project.json.
          #
          # Overridable by secrets, with today's values as the fallback. KasiGuru's hosting
          # moved to Anthony's Vercel account (team kasi-guru) on 2026-09-04 — the download
          # project is now kasi-guru/kasiguru-download. VERCEL_TOKEN has to belong to that
          # account too: the org and project ids alone are not enough, and a token issued by
          # the old account fails here with "Could not retrieve Project Settings".
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_i73rboyOEhnvrzQexyvfsHyR' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_iVOI7ueqHNurVNtHYHcS2ynNzLYY' }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Note a skipped site deploy
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning title=Download site not redeployed::The release itself published \
          fine — the APK is attached to the GitHub Release and app_releases is written. \
          Only https://kasiguru-download.vercel.app is still serving its previous build. \
          Usually a stale VERCEL_TOKEN: it has to belong to the account that owns \
          kasi-guru/kasiguru-download."

      - name: Publish app_releases doc
        working-directory: functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Dependencies were installed in an earlier step, before anything went public.
          #
          # apkUrl is this release's own versioned GitHub asset, not a moving "latest"
          # alias. That is only safe because GitHub keeps assets permanently: the URL
          # stored today still resolves to *this* build after ten more releases, so the
          # download history and the admin panel's yank/rollback stay meaningful.
          node publish_release.js \
            "${{ steps.version.outputs.code }}" \
            "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.apk_url }}"

      # Only once the APK is actually public — a lint or build failure published nothing and
      # must not be reported as half-published. Nothing here can unpublish a release asset,
      # but a release that got this far must not fail without naming the fix.
      - name: Report a half-published release
        if: failure() && steps.gh_release.outcome == 'success'
        run: |
          echo "::error title=Release is half-published::v${{ steps.version.outputs.name }} \
          is downloadable at ${{ steps.version.outputs.apk_url }} but the app_releases \
          document was not written. The in-app update check will report 'up to date' until \
          it is. Re-run this job, or from functions/ run: node publish_release.js \
          ${{ steps.version.outputs.code }} ${{ steps.version.outputs.name }} \
          ${{ steps.version.outputs.apk_url }}"
