# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# NOTE: Do not set org.gradle.java.home here — the Android Studio bundled JBR
# is JDK 25, which the project's Kotlin compiler cannot parse. Set JAVA_HOME
# to a JDK 17 installation instead (the Gradle wrapper picks it up).
# org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.20.8-hotspot

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
