<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>KasiGuru — Restricted Area</title>
  <!--
    SECURITY: This page intentionally contains NO admin functionality.

    removed during the Phase 1 security hardening (see docs/PHASE1_RUNBOOK.md).

    TODO(deployment): point this domain at the authenticated admin portal

  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1116;
      color: #e6e9ef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      text-align: center;
      background: #171c24;
      border: 1px solid #262d38;
      border-radius: 16px;
      padding: 40px 32px;
    }
    .badge {
      display: inline-block;
      background: #6c63ff;
      color: #fff;
      font-weight: 800;
      border-radius: 999px;
      padding: 8px 18px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    p { color: #9aa4b2; line-height: 1.6; font-size: 0.95rem; }
    a { color: #6c63ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">KasiGuru</div>
    <h1>Restricted Area</h1>
    <p>
      This area is reserved for KasiGuru administrators and requires authentication.
      If you are an administrator, use the secure admin portal.
    </p>
    <p style="margin-top:16px;">
      Everyone else — <a href="download.html">download the KasiGuru app here</a>.
    </p>
  </div>
</body>
</html>
