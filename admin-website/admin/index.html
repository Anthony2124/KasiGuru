<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>KasiGuru Admin: Sign in</title>
  <script src="js/iconsax.js?v=2026_10_signin"></script>
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css?v=2026_10_signin">
</head>
<body class="auth">

  <!-- One card: on a desktop a canopy panel with Jepjep beside the form, on a phone a compact header
       above it, so signing in never needs a scroll. Google comes first because verifiers must use
       it (their email has to be verified); email and password wait behind a disclosure. -->
  <main class="signin">
    <div class="signin-art" aria-hidden="true">
      <img src="img/jepjep-waving.webp" srcset="img/jepjep-waving.webp 334w, img/jepjep-waving@2x.webp 669w" sizes="220px" width="669" height="720" alt="">
      <p>Keep the Kasiguranin dictionary right.</p>
    </div>

    <section class="signin-panel">
      <header class="signin-brand">
        <img class="signin-jepjep" src="img/jepjep-waving.webp" width="669" height="720" alt="" aria-hidden="true">
        <div>
          <img class="logo-wordmark" src="img/wordmark.svg" alt="KasiGuru" width="132" height="24">
          <div class="logo-title">Moderation console</div>
        </div>
      </header>

      <h1 class="signin-title">Sign in</h1>
      <p class="signin-lede">For KasiGuru admins and verifiers.</p>

      <!-- Focused when it appears, so a screen reader hears what went wrong. -->
      <div id="login-error" class="error-banner" role="alert" tabindex="-1">
        <iconsax-icon name="info-circle" type="bulk" size="18" color="var(--status-rejected)"></iconsax-icon>
        <span class="grow">
          <span id="login-error-text"></span>
          <button type="button" id="use-other-account" class="text-link" hidden>Use a different Google account</button>
        </span>
      </div>

      <!-- Polite: it confirms something the person just did. -->
      <div id="login-notice" class="notice-banner" role="status" aria-live="polite">
        <iconsax-icon name="sms" type="bulk" size="18" color="var(--status-approved)"></iconsax-icon>
        <span id="login-notice-text"></span>
      </div>

      <div id="auth-checking" class="signin-checking" role="status">
        <span class="spinner spinner-sm" aria-hidden="true"></span>
        <span id="auth-checking-text">Checking your session&hellip;</span>
      </div>

      <div id="login-actions" class="signin-actions" hidden>
        <button id="google-login-btn" type="button" class="btn btn-primary signin-google">
          <span class="g-disc" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
          </span>
          <span class="btn-label">Continue with Google</span>
        </button>

        <details id="password-disclosure" class="signin-password">
          <summary>Use email and password instead</summary>
          <form id="password-form" novalidate>
            <div class="form-group">
              <label for="admin-email">Email</label>
              <div class="input-icon-wrap">
                <iconsax-icon name="sms" type="bulk" size="18" color="var(--muted)"></iconsax-icon>
                <input type="email" id="admin-email" name="email" class="form-control" placeholder="you@example.com" autocomplete="username" required>
              </div>
            </div>
            <div class="form-group">
              <div class="label-row">
                <label for="admin-password">Password</label>
                <button type="button" id="forgot-password-link" class="text-link">Forgot password?</button>
              </div>
              <div class="input-icon-wrap has-toggle">
                <iconsax-icon name="lock-1" type="bulk" size="18" color="var(--muted)"></iconsax-icon>
                <input type="password" id="admin-password" name="password" class="form-control" autocomplete="current-password" required>
                <button type="button" id="toggle-password" class="field-toggle" aria-pressed="false" aria-label="Show password">
                  <iconsax-icon name="eye" type="bulk" size="18" color="currentColor"></iconsax-icon>
                </button>
              </div>
            </div>
            <button id="login-btn" type="submit" class="btn btn-outline">
              <span class="btn-label">Sign in</span>
            </button>
          </form>
        </details>
      </div>

      <p class="signin-foot">Not on the team? Ask an admin to add your email on the Team page.</p>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
