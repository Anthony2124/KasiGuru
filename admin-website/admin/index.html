<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>KasiGuru — Admin Sign In</title>
  <script src="js/iconsax.js?v=2026_08_icons_v3"></script>
  <link rel="stylesheet" href="css/styles.css?v=2026_coast_light">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      animation: fadeSlideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      padding: 40px 36px;
      box-shadow: 0 24px 60px rgba(28, 34, 51, 0.10),
                  0 4px 12px rgba(28, 34, 51, 0.04);
    }

    .login-logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .login-divider {
      height: 1px;
      background: var(--border-color);
      margin: 24px 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-icon-wrap {
      position: relative;
    }

    .input-icon-wrap iconsax-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .input-icon-wrap .form-control {
      padding-left: 44px;
    }

    #google-login-btn {
      width: 100%;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      background: #FFFFFF;
      color: var(--coast-ink);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 18px;
    }

    #google-login-btn:hover {
      background: rgba(28, 34, 51, 0.03);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(28, 34, 51, 0.08);
    }

    .login-or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 18px 0;
    }

    .login-or-divider::before,
    .login-or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .login-or-divider:not(:empty)::before {
      margin-right: 12px;
    }

    .login-or-divider:not(:empty)::after {
      margin-left: 12px;
    }

    #login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
    }

    #login-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    #login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
    }

    .error-banner {
      background: rgba(255, 107, 107, 0.10);
      border: 1px solid rgba(255, 107, 107, 0.28);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--status-rejected);
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .lock-icon-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: var(--grad-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(123, 110, 246, 0.4);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Logo Row -->
      <div class="login-logo-row">
        <div class="lock-icon-wrapper">
          <iconsax-icon name="security-safe" type="bulk" size="28" color="#FFFFFF"></iconsax-icon>
        </div>
        <div>
          <div class="logo-badge" style="display:inline-block; margin-bottom:4px;">KasiGuru</div>
          <div style="font-size:0.8rem; color:var(--text-muted); font-weight:700;">Administrator Portal</div>
        </div>
      </div>

      <!-- Header -->
      <div class="login-header">
        <h1>Welcome back</h1>
        <p>Sign in with your admin credentials to access the dashboard.</p>
      </div>

      <div class="login-divider"></div>

      <!-- Error Banner -->
      <div id="login-error" class="error-banner" role="alert">
        <iconsax-icon name="info-circle" type="bulk" size="18" color="var(--status-rejected)"></iconsax-icon>
        <span id="login-error-text"></span>
      </div>

      <!-- 1-Click Google Sign-In -->
      <button id="google-login-btn" type="button" onclick="window.signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <div class="login-or-divider">or sign in with password</div>

      <!-- Login Form -->
      <div class="form-group">
        <label for="admin-email">Email Address</label>
        <div class="input-icon-wrap">
          <iconsax-icon name="sms" type="bulk" size="18" color="var(--text-muted)"></iconsax-icon>
          <input
            type="email"
            id="admin-email"
            class="form-control"
            placeholder="admin@kasiguru.app"
            autocomplete="email"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="admin-password">Password</label>
        <div class="input-icon-wrap">
          <iconsax-icon name="lock-1" type="bulk" size="18" color="var(--text-muted)"></iconsax-icon>
          <input
            type="password"
            id="admin-password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>
      </div>

      <button id="login-btn" class="btn btn-primary" onclick="window.signInAdmin()">
        <iconsax-icon name="login" type="bulk" size="18" color="#FFFFFF"></iconsax-icon>
        Sign In to Admin Panel
      </button>

      <!-- Footer note -->
      <div class="login-footer">
        <iconsax-icon name="lock" type="bulk" size="16" color="var(--coast-muted)"></iconsax-icon> This portal is for authorized administrators only.<br>
        Unauthorized access attempts are logged.
      </div>

    </div>
  </div>

  <script type="module" src="js/auth.js"></script>


</body>
</html>
